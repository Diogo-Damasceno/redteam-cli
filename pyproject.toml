[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam-cli"
version = "0.1.0"
description = "CLI educacional de Red Team: modulos simulados (rede, fisico, ransomware, cripto) com guardrails de lab e analise por LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diogo Damasceno" }]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.40", "anthropic>=0.34"]

[project.scripts]
redteam = "redteam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
